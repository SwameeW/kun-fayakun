name: Deploy to GitHub Pages

# Deploys only what CI has passed: after a CI run for a push to main succeeds (validate,
# typecheck, lint, loading budget and the browser tests), or when started by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A pull request from a fork's own "main" branch also matches the branch filter: only pushes deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI tested, not whatever main points at by the time this runs.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The satellite catalogue's snapshot for this deploy (the explorer's fallback when CelesTrak
      # declines a visitor's download); never committed. A failed fetch only leaves it out.
      - name: Snapshot the satellite catalogue
        run: |
          mkdir -p public/assets/live
          if curl -sf --max-time 60 -o "$RUNNER_TEMP/active.tle" "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle"; then
            { echo "#fetched $(date -u +%Y-%m-%dT%H:%M:%SZ)"; cat "$RUNNER_TEMP/active.tle"; } > public/assets/live/active.tle
          else
            echo "No catalogue snapshot this deploy."
          fi
      # validate + typecheck + vite build: a scripture mismatch never deploys.
      - run: npm run build
      # A manual run has no CI run behind it, so the loading budget is checked here too.
      - run: npx tsx scripts/check-bundle.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
